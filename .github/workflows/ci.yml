name: CI - Build, Test, and Container Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Lint check (flake8 if available)
        run: |
          pip install flake8 || true
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
      
      - name: Run pytest
        run: |
                    pytest tests/ -v --tb=short
      
      - name: Build Docker image
        run: |
          docker build -t object-detection-api:latest .
      
      - name: Container smoke test
        run: |
          docker run -d --name od-smoke -p 8001:8001 object-detection-api:latest
          sleep 45
          curl -f http://localhost:8001/health || (docker logs od-smoke && exit 1)
          python3 << 'PYEOF'
          import requests
          import io
          from PIL import Image
          img = Image.new('RGB', (100, 100), color=(73, 109, 137))
          buf = io.BytesIO()
          img.save(buf, format='JPEG')
          buf.seek(0)
          r = requests.post('http://localhost:8001/predict', files={'file': ('test.jpg', buf, 'image/jpeg')})
          print('Status:', r.status_code)
          print('Body:', r.json())
          assert r.status_code in [200, 503]
          PYEOF
          docker stop od-smoke
          docker rm od-smoke
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            monitoring/
            logs/
