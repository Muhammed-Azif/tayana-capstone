name: CI - Build, Test, and Container Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Lint check
        run: |
          pip install flake8 || true
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
      
      - name: Run pytest
        run: pytest tests/ -v --tb=short
      
      - name: Build Docker image
        run: docker build -t object-detection-api:latest .
      
      - name: Container smoke test
        run: |
          docker run -d --name od-smoke -p 8001:8000 object-detection-api:latest
          sleep 45
          curl -f http://localhost:8001/health || (docker logs od-smoke && exit 1)
          curl -X POST -F "file=@sample_inputs/sample_street.jpg" http://localhost:8001/predict || (docker logs od-smoke && exit 1)
          docker stop od-smoke
          docker rm od-smoke
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            monitoring/
            logs/